<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RJ MPBS AI - Universal Studio</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0b0f19;
            --card: #111827;
            --text: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #1f2937;
            --accent: #10b981;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

        #loginModal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.98); display: flex; justify-content: center; align-items: center; z-index: 2000;
        }
        .login-box {
            background: var(--card); border: 1px solid var(--border); padding: 40px; border-radius: 24px;
            width: 100%; max-width: 420px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.8);
        }
        .login-logo { width: 64px; height: 64px; border-radius: 16px; object-fit: cover; margin-bottom: 20px; border: 2px solid var(--primary); }
        .login-box h1 { color: #fff; margin-bottom: 8px; font-size: 1.5rem; }
        .login-box p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; }
        .login-box input {
            width: 100%; padding: 14px 18px; background: #1a2234; border: 1px solid var(--border);
            border-radius: 12px; color: #fff; margin-bottom: 16px; outline: none; font-size: 1rem;
        }
        .login-box button {
            width: 100%; padding: 14px; background: var(--primary); color: #fff; border: none;
            border-radius: 12px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.2s;
        }
        .login-box button:hover { background: var(--primary-hover); }

        header {
            background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 24px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo-container { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 1.2rem; color: #fff; }
        .brand-logo-img { width: 40px; height: 40px; border-radius: 12px; object-fit: cover; border: 2px solid var(--primary); }
        .free-badge { background: rgba(16, 185, 129, 0.15); color: var(--accent); padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }

        .main-workspace { flex: 1; display: flex; max-width: 1400px; width: 100%; margin: 0 auto; padding: 20px; gap: 20px; overflow: hidden; }

        .sidebar-panel {
            width: 320px; background: var(--card); border: 1px solid var(--border); border-radius: 20px;
            display: flex; flex-direction: column; padding: 20px; gap: 15px; overflow-y: auto;
        }
        .agent-preview-box {
            background: #1a2234; border: 2px dashed var(--primary); border-radius: 16px; padding: 12px; text-align: center;
        }
        .animated-avatar {
            width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent);
            margin: 0 auto 8px auto; box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
        }
        .agent-title { font-size: 0.95rem; font-weight: 600; color: #fff; }
        .agent-sub { font-size: 0.7rem; color: var(--accent); margin-top: 2px; }

        .tool-category h3 { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .tool-btn {
            width: 100%; background: #1a2234; border: 1px solid var(--border); color: #fff; padding: 9px 12px;
            border-radius: 10px; text-align: left; font-size: 0.83rem; cursor: pointer; margin-bottom: 6px; transition: 0.2s;
            display: flex; align-items: center; gap: 8px;
        }
        .tool-btn:hover { background: var(--primary); border-color: var(--primary); }

        .chat-section { flex: 1; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; position: relative; }
        .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding: 20px; }
        
        .welcome-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            flex: 1; text-align: center; gap: 16px;
        }
        .welcome-logo { width: 80px; height: 80px; border-radius: 20px; object-fit: cover; border: 3px solid var(--primary); }
        .welcome-title { font-size: 2rem; font-weight: 700; color: #fff; }
        .welcome-subtitle { color: var(--text-muted); font-size: 0.95rem; max-width: 550px; line-height: 1.5; }

        .msg { padding: 14px 18px; border-radius: 16px; max-width: 85%; line-height: 1.6; font-size: 0.95rem; word-break: break-word; white-space: pre-wrap; position: relative; }
        .user-msg { background: var(--primary); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
        .ai-msg { background: #1a2234; color: var(--text); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--border); }
        
        /* ভয়েস রিড আউট বাটন */
        .speak-btn { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 0.85rem; margin-top: 8px; display: inline-flex; align-items: center; gap: 4px; font-weight: 600; }
        .speak-btn:hover { text-decoration: underline; }

        .ai-img-preview { margin-top: 10px; max-width: 100%; border-radius: 12px; border: 1px solid var(--border); }
        .map-link-btn { display: inline-block; margin-top: 8px; background: var(--accent); color: #000; padding: 6px 14px; border-radius: 8px; font-weight: 600; text-decoration: none; font-size: 0.85rem; }
        .map-link-btn:hover { opacity: 0.9; }

        .input-bar-area { padding: 15px 20px; background: #0b0f19; border-top: 1px solid var(--border); display: flex; gap: 12px; align-items: center; position: relative; }
        
        .plus-container { position: relative; }
        .plus-btn {
            background: var(--card); border: 1px solid var(--border); color: #fff; width: 44px; height: 44px;
            border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem;
            cursor: pointer; transition: 0.2s; flex-shrink: 0;
        }
        .plus-btn:hover { background: var(--primary); border-color: var(--primary); }

        .plus-menu {
            display: none; position: absolute; bottom: 60px; left: 0; background: var(--card);
            border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 15px 30px rgba(0,0,0,0.6);
            width: 210px; z-index: 100; overflow: hidden; padding: 6px 0;
        }
        .plus-menu.active { display: block; }
        .menu-option {
            padding: 10px 16px; font-size: 0.88rem; color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 8px;
        }
        .menu-option:hover { background: #1a2234; color: var(--primary); }

        .input-bar-area input {
            flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 18px; color: #fff; outline: none; font-size: 1rem;
        }
        .input-bar-area input:focus { border-color: var(--primary); }

        .mic-btn {
            background: var(--card); border: 1px solid var(--border); color: #fff; width: 44px; height: 44px;
            border-radius: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: 0.2s; flex-shrink: 0; font-size: 1.1rem;
        }
        .mic-btn.recording { background: var(--danger); border-color: var(--danger); animation: pulseAnim 1.5s infinite; }

        @keyframes pulseAnim {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .send-btn {
            background: var(--primary); border: none; border-radius: 14px; width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; flex-shrink: 0;
        }
        .send-btn:hover { background: var(--primary-hover); }
        .send-btn svg { width: 20px; height: 20px; fill: #fff; }

        @media(max-width: 768px) {
            .main-workspace { flex-direction: column; padding: 10px; gap: 10px; }
            .sidebar-panel { width: 100%; max-height: 160px; padding: 12px; }
        }
    </style>
</head>
<body>

    <div id="loginModal">
        <div class="login-box">
            <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=150&h=150&fit=crop" class="login-logo" alt="Logo">
            <h1>RJ MPBS AI</h1>
            <p>আপনার জিমেইল দিয়ে স্টুডিওতে প্রবেশ করুন</p>
            <input type="text" id="userNameInput" placeholder="আপনার জিমেইল (যেমন: yasin@gmail.com)">
            <button onclick="loginUser()">শুরু করুন</button>
        </div>
    </div>

    <header>
        <div class="logo-container">
            <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=100&h=100&fit=crop" class="brand-logo-img" alt="Logo">
            RJ MPBS AI - Studio
        </div>
        <div class="free-badge">🎉 লাইভ ভয়েস ও এআই অ্যাসিস্ট্যান্ট</div>
    </header>

    <div class="main-workspace">
        <div class="sidebar-panel">
            <div class="agent-preview-box">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&h=200&fit=crop" class="animated-avatar" alt="AI Agent">
                <div class="agent-title">RJ Live Expert</div>
                <div class="agent-sub">● ভয়েস ও চ্যাট একটিভ</div>
            </div>

            <div class="tool-category">
                <h3>কুইক অপশন</h3>
                <button class="tool-btn" onclick="triggerTool('হাই')">👋 হ্যালো বলুন</button>
                <button class="tool-btn" onclick="triggerTool('কক্সবাজার সমুদ্র সৈকত লোকেশন দেখতে চাই')">📍 লোকেশন ও ছবি</button>
                <button class="tool-btn" onclick="triggerTool('আমাকে একটি দারুণ আইডিয়া দিন।')">🎨 ক্রিয়েটিভ আইডিয়া</button>
            </div>
        </div>

        <div class="chat-section">
            <div class="chat-messages" id="chatBox">
                <div class="welcome-screen" id="welcomeScreen">
                    <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=200&h=200&fit=crop" class="welcome-logo" alt="Logo">
                    <div class="welcome-title" id="greetingTitle">হ্যালো, ইউজার</div>
                    <div class="welcome-subtitle">আমি আপনার পার্সোনাল ভয়েস এআই অ্যাসিস্ট্যান্ট। কথা বলুন, শুনুন এবং যেকোনো বিষয়ে সাহায্য নিন!</div>
                </div>
            </div>

            <div class="input-bar-area">
                <div class="plus-container">
                    <div class="plus-btn" onclick="togglePlusMenu(event)">+</div>
                    <div class="plus-menu" id="plusMenu">
                        <div class="menu-option" onclick="document.getElementById('fileInput').click(); togglePlusMenu();">📷 ছবি বা ফাইল দিন</div>
                        <div class="menu-option" onclick="triggerTool('আমাকে একটি দারুণ আইডিয়া দিন।'); togglePlusMenu();">💡 আইডিয়া নিন</div>
                    </div>
                </div>
                <input type="file" id="fileInput" style="display:none" accept="image/*" onchange="handleFileSelect(event)">

                <input type="text" id="userInput" placeholder="আপনার বার্তা বা ভয়েস কমান্ড দিন..." onkeypress="if(event.key==='Enter') sendMessage()">

                <button class="mic-btn" id="micBtn" onclick="toggleVoice()" title="Voice Input">🎤</button>

                <button class="send-btn" onclick="sendMessage()" title="Send">
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = "User";
        let recognition = null;
        let isRecording = false;

        function loginUser() {
            let emailInput = document.getElementById('userNameInput').value.trim();
            if(!emailInput) {
                alert('দয়া করে আপনার জিমেইল লিখুন।');
                return;
            }
            
            let cleanName = emailInput;
            if(emailInput.includes('@')) {
                cleanName = emailInput.split('@')[0];
            }
            currentUser = cleanName.charAt(0).toUpperCase() + cleanName.slice(1);
            
            document.getElementById('greetingTitle').innerText = `হ্যালো, ${currentUser}`;
            document.getElementById('loginModal').style.display = 'none';
        }

        function triggerTool(promptText) {
            document.getElementById('userInput').value = promptText;
            sendMessage();
        }

        function togglePlusMenu(e) {
            if(e) e.stopPropagation();
            const menu = document.getElementById('plusMenu');
            menu.classList.toggle('active');
        }

        window.onclick = function() {
            const menu = document.getElementById('plusMenu');
            if(menu && menu.classList.contains('active')) {
                menu.classList.remove('active');
            }
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if(file) {
                const chatBox = document.getElementById('chatBox');
                const welcomeScreen = document.getElementById('welcomeScreen');
                if(welcomeScreen) welcomeScreen.style.display = 'none';

                chatBox.innerHTML += `<div class="msg user-msg">[ফাইল যুক্ত করা হয়েছে: ${file.name}]</div>`;
                let replyText = `আপনার ফাইলটি পেয়েছি ${currentUser}! বলুন এটি নিয়ে কী করতে হবে।`;
                chatBox.innerHTML += `<div class="msg ai-msg">${escapeHtml(replyText)}<br><button class="speak-btn" onclick="speakText('${encodeURIComponent(replyText)}')">🔊 ভয়েস শুনুন</button></div>`;
                speakText(replyText);
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        // ১. ভয়েস ইনপুট (Speech to Text) ফাংশন
        function toggleVoice() {
            const micBtn = document.getElementById('micBtn');
            const inputField = document.getElementById('userInput');

            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('আপনার ব্রাউজার ভয়েস ইনপুট সমর্থন করছে না।');
                return;
            }

            if (!recognition) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.lang = 'bn-BD'; // বাংলা ভাষা সাপোর্ট
                recognition.interimResults = false;
                recognition.maxAlternatives = 1;

                recognition.onresult = function(event) {
                    inputField.value = event.results[0][0].transcript;
                    stopVoiceUI();
                    sendMessage(); // মুখে কথা শেষ করলেই অটোমেটিক মেসেজ সেন্ড হয়ে যাবে!
                };

                recognition.onerror = function() { stopVoiceUI(); };
                recognition.onend = function() { stopVoiceUI(); };
            }

            if (!isRecording) {
                recognition.start();
                isRecording = true;
                micBtn.classList.add('recording');
                inputField.placeholder = "শুনছি, কথা বলুন...";
            } else {
                recognition.stop();
                stopVoiceUI();
            }
        }

        function stopVoiceUI() {
            isRecording = false;
            document.getElementById('micBtn').classList.remove('recording');
            document.getElementById('userInput').placeholder = "আপনার বার্তা বা ভয়েস কমান্ড দিন...";
        }

        // ২. ভয়েস আউটপুট (Text to Speech) ফাংশন - এআই নিজ মুখে কথা বলবে
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // আগের কোনো ভয়েস চলছে কিনা তা থামিয়ে দেওয়া
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'bn-BD'; // বাংলা উচ্চারণ
                utterance.rate = 1.0; // কথার গতি
                window.speechSynthesis.speak(utterance);
            }
        }

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const welcomeScreen = document.getElementById('welcomeScreen');
            const message = inputField.value.trim();

            if(!message) return;

            if(welcomeScreen) {
                welcomeScreen.style.display = 'none';
            }

            chatBox.innerHTML += `<div class="msg user-msg">${escapeHtml(message)}</div>`;
            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // লোকেশন ও ইমেজ জেনারেশন হ্যান্ডলিং
            const lowerMsg = message.toLowerCase();
            if(lowerMsg.includes('লোকেশন') || lowerMsg.includes('কোথায়') || lowerMsg.includes('যাবো') || lowerMsg.includes('ম্যাপ')) {
                let placeName = message.replace('লোকেশন', '').replace('দেখাও', '').replace('কোথায়', '').replace('যাবো', '').trim();
                if(!placeName) placeName = "Tourist Spot";
                
                let mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(placeName)}`;
                let imageUrl = `https://pollinations.ai/p/${encodeURIComponent(placeName + ' scenic view realistic photography')}?width=500&height=300&nologo=true`;

                let spokenText = `হ্যালো ${currentUser}, ${placeName} এর লোকেশন এবং ছবি নিচে দেওয়া হলো।`;
                let replyHTML = `${spokenText}<br>
                <a href="${mapUrl}" target="_blank" class="map-link-btn">📍 গুগল ম্যাপে লোকেশন দেখুন</a><br>
                <img src="${imageUrl}" class="ai-img-preview" alt="Location View"><br>
                <button class="speak-btn" onclick="speakText('${encodeURIComponent(spokenText)}')">🔊 ভয়েস শুনুন</button>`;

                setTimeout(() => {
                    chatBox.innerHTML += `<div class="msg ai-msg">${replyHTML}</div>`;
                    speakText(spokenText);
                    chatBox.scrollTop = chatBox.scrollHeight;
                }, 500);
                return;
            }

            // সাধারণ চ্যাট এবং গ্রিটিং লজিক
            let aiReply = "";
            if(lowerMsg.includes('হাই') || lowerMsg.includes('হ্যালো') || lowerMsg.includes('hello') || lowerMsg.includes('hi')) {
                aiReply = `হ্যালো ${currentUser}, আপনি কেমন আছেন? আমি আপনাকে কীভাবে সাহায্য করতে পারি?`;
            } else {
                aiReply = `ধন্যবাদ ${currentUser}! আপনার কথাটি বুঝতে পেরেছি। বলুন এই বিষয়ে আর কী করতে হবে।`;
            }

            setTimeout(() => {
                let fullHTML = `${escapeHtml(aiReply)}<br><button class="speak-btn" onclick="speakText('${encodeURIComponent(aiReply)}')">🔊 ভয়েস শুনুন</button>`;
                chatBox.innerHTML += `<div class="msg ai-msg">${fullHTML}</div>`;
                
                // এআই অটোমেটিক ভয়েসে উত্তরটি পড়ে শোনাবে
                speakText(aiReply);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 600);
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
