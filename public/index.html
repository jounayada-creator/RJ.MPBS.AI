<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RJ Universal Studio</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-color: #111827;
            --border-color: #1f2937;
            --primary-color: #6366f1;
            --text-color: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-green: #10b981;
            --danger-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* মেইন লেআউট */
        .app-container {
            display: flex;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        /* সাইডবার (কম্পিউটারের জন্য) */
        .sidebar {
            width: 280px;
            background-color: var(--panel-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 15px;
        }

        .sidebar-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 5px;
        }

        .tool-btn {
            background: #1a2234;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 14px;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }

        /* চ্যাট মেইন এরিয়া */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
            position: relative;
            overflow: hidden;
        }

        .chat-header {
            padding: 15px 20px;
            background-color: var(--panel-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.5;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .user-message {
            background-color: var(--primary-color);
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .ai-message {
            background-color: var(--panel-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        /* ইনপুট বার ও প্লাস (+) মেনু সেকশন */
        .chat-input-area {
            padding: 15px 20px;
            background-color: var(--panel-color);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        /* প্লাস (+) বাটন ও পপআপ */
        .plus-container {
            position: relative;
        }

        .plus-btn {
            background: #1a2234;
            border: 1px solid var(--border-color);
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            cursor: pointer;
            flex-shrink: 0;
            transition: 0.2s;
        }

        .plus-btn:hover {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }

        .plus-menu {
            display: none;
            position: absolute;
            bottom: 55px;
            left: 0;
            background: var(--panel-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 200px;
            z-index: 100;
            overflow: hidden;
            padding: 5px 0;
        }

        .plus-menu.active {
            display: block;
        }

        .menu-option {
            padding: 10px 15px;
            font-size: 0.85rem;
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .menu-option:hover {
            background: #1a2234;
            color: var(--primary-color);
        }

        .chat-input-area input {
            flex: 1;
            background-color: #1a2234;
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 12px 18px;
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
        }

        .chat-input-area input:focus {
            border-color: var(--primary-color);
        }

        /* ভয়েস (মাইক্রোফোন) বাটন */
        .mic-btn {
            background: #1a2234;
            border: 1px solid var(--border-color);
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: 0.2s;
            font-size: 1.1rem;
        }

        .mic-btn.recording {
            background: var(--danger-color);
            border-color: var(--danger-color);
            animation: pulseAnim 1.5s infinite;
        }

        @keyframes pulseAnim {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .send-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: 0.2s;
        }

        .send-btn:hover {
            background-color: #4f46e5;
        }

        .send-btn svg {
            width: 18px;
            height: 18px;
            fill: white;
        }

        /* মোবাইল রেসপন্সিভ ডিজাইন */
        @media (max-width: 768px) {
            .sidebar {
                display: none; /* মোবাইলে সাইডবার লুকিয়ে রাখা হয়েছে যাতে স্ক্রিন পরিষ্কার থাকে */
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-title">Tools & Categories</div>
            <button class="tool-btn" onclick="setPrompt('Logo & Brand Identity')">🎨 Logo & Brand Identity</button>
            <button class="tool-btn" onclick="setPrompt('Apparel & T-Shirt Design')">👕 Apparel & T-Shirt Design</button>
            <button class="tool-btn" onclick="setPrompt('Custom Stickers & Badges')">🏷️ Custom Stickers & Badges</button>
            <button class="tool-btn" onclick="setPrompt('Social Media Ad Banners')">📱 Social Media Ad Banners</button>
            <button class="tool-btn" onclick="setPrompt('Daily Planners & Notebooks')">📔 Daily Planners & Notebooks</button>
            <button class="tool-btn" onclick="setPrompt('Business Cards & Flyers')">💼 Business Cards & Flyers</button>
        </div>

        <div class="chat-main">
            <div class="chat-header">
                <h2>RJ Universal Studio</h2>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="message ai-message">হ্যালো! আমি আপনার এআই ডিজাইন অ্যাসিস্ট্যান্ট। লোগো, টি-শার্ট, স্টিকার বা যেকোনো গ্রাফিক ডিজাইনের আইডিয়া ও প্রম্পটের জন্য আমাকে বলুন।</div>
            </div>

            <div class="chat-input-area">
                <div class="plus-container">
                    <div class="plus-btn" onclick="togglePlusMenu(event)">+</div>
                    <div class="plus-menu" id="plusMenu">
                        <div class="menu-option" onclick="document.getElementById('fileInput').click(); togglePlusMenu();">📷 ছবি বা স্ক্রিনশট দিন</div>
                        <div class="menu-option" onclick="setPrompt('Give me a trending color palette for my design.'); togglePlusMenu();">🎨 কালার প্যালেট</div>
                        <div class="menu-option" onclick="setPrompt('Suggest creative concept ideas for my project.'); togglePlusMenu();">💡 আইডিয়া জেনারেটর</div>
                    </div>
                </div>
                <input type="file" id="fileInput" style="display:none" accept="image/*" onchange="handleFileSelect(event)">

                <input type="text" id="userInput" placeholder="আপনার ডিজাইন আইডিয়া এখানে লিখুন বা বলুন..." onkeypress="if(event.key === 'Enter') sendMessage()">

                <button class="mic-btn" id="micBtn" onclick="toggleVoice()" title="Voice Input">
                    🎤
                </button>

                <button class="send-btn" onclick="sendMessage()">
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        let recognition = null;
        let isRecording = false;

        function togglePlusMenu(e) {
            if(e) e.stopPropagation();
            const menu = document.getElementById('plusMenu');
            menu.classList.toggle('active');
        }

        window.onclick = function() {
            const menu = document.getElementById('plusMenu');
            if(menu && menu.classList.contains('active')) {
                menu.classList.remove('active');
            }
        }

        function setPrompt(text) {
            document.getElementById('userInput').value = text;
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if(file) {
                const chatBox = document.getElementById('chatMessages');
                chatBox.innerHTML += `<div class="message user-message">[ছবি যুক্ত করা হয়েছে: ${file.name}]</div>`;
                chatBox.innerHTML += `<div class="message ai-message">আপনার ছবিটি পেয়েছি! এই ডিজাইন বা স্টাইলের ওপর ভিত্তি করে বিস্তারিত কনসেপ্ট তৈরি করে দিচ্ছি।</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        // ভয়েস রিকগনিশন (কথা বলে টাইপ করা) ফিচার
        function toggleVoice() {
            const micBtn = document.getElementById('micBtn');
            const inputField = document.getElementById('userInput');

            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('আপনার ব্রাউজার ভয়েস ইনপুট সমর্থন করছে না। দয়া করে ক্রোম ব্রাউজার ব্যবহার করুন।');
                return;
            }

            if (!recognition) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.lang = 'bn-BD'; // বাংলা ভাষা
                recognition.interimResults = false;
                recognition.maxAlternatives = 1;

                recognition.onresult = function(event) {
                    inputField.value = event.results[0][0].transcript;
                    stopVoiceUI();
                };

                recognition.onerror = function() { stopVoiceUI(); };
                recognition.onend = function() { stopVoiceUI(); };
            }

            if (!isRecording) {
                recognition.start();
                isRecording = true;
                micBtn.classList.add('recording');
                inputField.placeholder = "শুনছি, কথা বলুন...";
            } else {
                recognition.stop();
                stopVoiceUI();
            }
        }

        function stopVoiceUI() {
            isRecording = false;
            document.getElementById('micBtn').classList.remove('recording');
            document.getElementById('userInput').placeholder = "আপনার ডিজাইন আইডিয়া এখানে লিখুন বা বলুন...";
        }

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const chatBox = document.getElementById('chatMessages');
            const message = inputField.value.trim();

            if(!message) return;

            chatBox.innerHTML += `<div class="message user-message">${escapeHtml(message)}</div>`;
            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch('/api/ai-core', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                const data = await res.json();
                chatBox.innerHTML += `<div class="message ai-message">${escapeHtml(data.reply)}</div>`;
            } catch (err) {
                chatBox.innerHTML += `<div class="message ai-message">কানেকশন সমস্যা হয়েছে। দয়া করে আবার চেষ্টা করুন।</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
