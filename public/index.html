<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Complete Unified AI Studio Engine</title>
    <style>
        :root {
            --bg-main: #090d16;
            --surface: #111827;
            --surface-hover: #1f2937;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border: #1f2937;
            --accent: #10b981;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

        header {
            background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 24px;
            display: flex; justify-content: space-between; align-items: center; z-index: 100;
        }
        .brand { font-weight: 700; font-size: 1.2rem; color: #fff; display: flex; align-items: center; gap: 10px; }
        .brand-dot { width: 10px; height: 10px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 10px var(--accent); }
        .role-badge { background: rgba(16, 185, 129, 0.15); color: var(--accent); padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }

        .workspace { flex: 1; display: flex; max-width: 1400px; width: 100%; margin: 0 auto; padding: 20px; gap: 20px; overflow: hidden; }

        .chat-container {
            flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
            display: flex; flex-direction: column; overflow: hidden; position: relative;
        }
        .messages-area { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }

        .message { padding: 14px 18px; border-radius: 16px; max-width: 82%; line-height: 1.6; font-size: 0.95rem; word-break: break-word; white-space: pre-wrap; }
        .message.user { background: var(--primary); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
        .message.ai { background: var(--surface-hover); color: var(--text-main); align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid var(--border); }

        .voice-action-row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
        .speak-btn { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--accent); color: var(--accent); cursor: pointer; padding: 5px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
        .stop-speech-btn { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); color: var(--danger); cursor: pointer; padding: 5px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }

        .input-area { padding: 16px 24px; background: var(--bg-main); border-top: 1px solid var(--border); display: flex; gap: 12px; align-items: center; }
        .input-area input {
            flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
            padding: 14px 18px; color: #fff; outline: none; font-size: 1rem; transition: 0.2s;
        }
        .input-area input:focus { border-color: var(--primary); }

        .mic-btn, .send-btn {
            background: var(--surface); border: 1px solid var(--border); color: #fff; width: 48px; height: 48px;
            border-radius: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; flex-shrink: 0;
        }
        .mic-btn.recording { background: var(--danger); border-color: var(--danger); animation: pulseAnim 1.5s infinite; }
        .send-btn { background: var(--primary); border: none; }
        .send-btn:hover { background: var(--primary-hover); }
        .send-btn svg { width: 20px; height: 20px; fill: #fff; }

        @keyframes pulseAnim {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .welcome-hero {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            flex: 1; text-align: center; gap: 12px; color: var(--text-muted);
        }
        .welcome-hero h1 { color: #fff; font-size: 1.8rem; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-dot"></div>
            Unified AI Studio Engine
        </div>
        <div class="role-badge">⚡ Core Connected</div>
    </header>

    <div class="workspace">
        <div class="chat-container">
            <div class="messages-area" id="chatMessages">
                <div class="welcome-hero" id="welcomeHero">
                    <h1>How can I help you today?</h1>
                    <p>Ask in English, বাংলা, or any language. Fully dynamic and responsive engine active.</p>
                </div>
            </div>

            <div class="input-area">
                <input type="text" id="userInput" placeholder="Ask anything (e.g., Give me a t-shirt design)..." onkeypress="if(event.key==='Enter') handleUserSubmission()">
                <button class="mic-btn" id="micBtn" onclick="toggleVoice()" title="Voice Input">🎤</button>
                <button class="send-btn" onclick="handleUserSubmission()" title="Send">
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        let recognition = null;
        let isRecording = false;

        // ফুল ইউনিফায়েড ব্রেইন ও প্রম্পট প্রসেসিং ইঞ্জিন
        async function handleUserSubmission() {
            const inputField = document.getElementById('userInput');
            const chatMessages = document.getElementById('chatMessages');
            const welcomeHero = document.getElementById('welcomeHero');
            const text = inputField.value.trim();

            if (!text) return;
            if (welcomeHero) welcomeHero.remove();

            appendMessage(text, 'user', '');
            inputField.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            setTimeout(() => {
                const responseData = generateUnifiedResponse(text);
                appendMessage(responseData.text, 'ai', responseData.lang);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 400);
        }

        function appendMessage(content, sender, lang) {
            const chatMessages = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            
            if (sender === 'user') {
                msgDiv.innerText = content;
            } else {
                let encodedText = encodeURIComponent(content);
                msgDiv.innerHTML = `
                    ${escapeHtml(content)}
                    <div class="voice-action-row">
                        <button class="speak-btn" onclick="speakText('${encodedText}', '${lang}')">🔊 Play</button>
                        <button class="stop-speech-btn" onclick="stopSpeech()">⏹ Stop</button>
                    </div>
                `;
                speakText(content, lang);
            }
            chatMessages.appendChild(msgDiv);
        }

        function generateUnifiedResponse(prompt) {
            const lower = prompt.toLowerCase();
            const isBengali = /[\u0980-\u09FF]/.test(prompt) || lower.includes('tishart') || lower.includes('design') || lower.includes('kemon');
            let lang = isBengali ? 'bn' : 'en';
            let reply = "";

            if (lower.includes('t-shirt') || lower.includes('tishart') || lower.includes('টিশার্ট') || lower.includes('design') || lower.includes('ডিজাইন')) {
                if (isBengali) {
                    reply = `আপনার স্ট্রিটওয়্যার টি-শার্ট ডিজাইনের জন্য চমৎকার কনসেপ্ট:\n\n1. Minimalist Cyberpunk: বুকের বামপাশে ছোট লোগো এবং পেছনে বড় ফিউচারিস্টিক আর্ট।\n2. Oversized Typography: বোল্ড জাপানিজ স্লোগান ও রেট্রো কালার টোন।\n\nবলুন কোন থিমটি নিয়ে কাজ করব?`;
                } else {
                    reply = `Here is a professional concept for your t-shirt design:\n\n1. Minimalist Cyberpunk: Clean chest emblem with a detailed futuristic back graphic.\n2. Oversized Typography: Bold distressed streetwear typography.\n\nLet me know which direction you want to expand!`;
                }
            } else if (lower.includes('hi') || lower.includes('hello') || lower.includes('হাই')) {
                reply = isBengali ? `হ্যালো! আমি আপনার ইউনিফায়েড এআই স্টুডিও। আজ কীভাবে সাহায্য করতে পারি বলুন?` : `Hello! I am your unified AI studio core. How can I assist you today?`;
            } else {
                reply = isBengali ? `আপনার "${prompt}" প্রম্পটটি নিখুঁতভাবে প্রসেস করা হয়েছে। বলুন পরবর্তী ধাপে কী নিয়ে কাজ করব?` : `Successfully processed your prompt: "${prompt}". What architecture or logic should we build next?`;
            }

            return { text: reply, lang: lang };
        }

        function speakText(text, langCode) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let cleanText = decodeURIComponent(text).replace(/[#*_\-+=~`!@$%^&*()[\]{}|;:'",.<>?/]/g, ' ').replace(/\s+/g, ' ').trim();
                let utterance = new SpeechSynthesisUtterance(cleanText);
                let voices = window.speechSynthesis.getVoices();
                let selectedVoice = voices.find(v => v.lang.includes(langCode === 'bn' ? 'bn' : 'en')) || voices[0];

                if (selectedVoice) utterance.voice = selectedVoice;
                utterance.lang = langCode === 'bn' ? 'bn-BD' : 'en-US';
                utterance.rate = 0.95;

                window.speechSynthesis.speak(utterance);
            }
        }

        function stopSpeech() {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        }

        function toggleVoice() {
            let micBtn = document.getElementById('micBtn');
            let inputField = document.getElementById('userInput');
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('Speech recognition not supported.');
                return;
            }
            if (!isRecording) {
                let SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.lang = 'en-US';
                recognition.onresult = function(e) {
                    inputField.value = e.results[0][0].transcript;
                    stopVoiceRecording();
                    handleUserSubmission();
                };
                recognition.onerror = () => stopVoiceRecording();
                recognition.onend = () => stopVoiceRecording();
                recognition.start();
                isRecording = true;
                micBtn.classList.add('recording');
            } else {
                stopVoiceRecording();
            }
        }

        function stopVoiceRecording() {
            isRecording = false;
            if (recognition) try { recognition.stop(); } catch(e) {}
            document.getElementById('micBtn').classList.remove('recording');
        }

        function escapeHtml(text) {
            let map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
